<div class="card container-fluid mt-4">
  <div class="card-header bg-light">
    <div class="row align-items-center">
      <div class="col-md-4">
        <h4 class="mb-0">Liste des élèves</h4>
      </div>
      <div class="col-md-4 text-center">
        <h4 class="mb-0">Nombre d'élèves: {{eleve.length}}</h4>
      </div>
      <div class="col-md-4 text-end">
        <button class="btn btn-success" (click)="addEleve()">
          <i class="bi bi-plus-circle"></i> Ajouter un élève
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Numéro carte</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Adresse</th>
            <th>Téléphone</th>
            <th>Date naissance</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of eleve">
            <td>{{e.numero_carte}}</td>
            <td>{{e.prenom}}</td>
            <td>{{e.nom}}</td>
            <td>{{e.adresse}}</td>
            <td>{{e.telephone}}</td>
            <td>{{e.date_naissance}}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="editEleve(e)">
                <i class="bi bi-pencil"></i> Modifier
              </button>
              <button class="btn btn-danger btn-sm" (click)="deleteEleve(e.id)">
                <i class="bi bi-trash"></i> Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div *ngIf="eleve.length === 0" class="alert alert-info text-center">
      Aucun élève trouvé
    </div>
  </div>
</div>
