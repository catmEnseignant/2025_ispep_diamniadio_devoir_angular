<div class="container-fluid mt-4">
  <div class="card-header text-center bg-light py-2 shadow-sm rounded-2">
    <div class="row">
      <div class="col-4">
        <h4 class="text-primary fw-bold"><b>Liste des élèves</b></h4>
      </div>
      <div class="col-4">
        <h4 class="text-primary fw-bold"><b>Nombre d’élèves ({{ eleves.length }})</b></h4>
      </div>
      <div class="col-4 text-end">
        <a class="btn btn-primary" (click)="ajouterEleve()"><b>Ajouter un élève</b></a>
      </div>
    </div>
  </div>

  <div class="card-body container my-2">
    <table class="table table-light table-hover table-sm">
      <thead class="table-light">
        <tr class="text-center">
          <th>Carte</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Téléphone</th>
          <th>Adresse</th>
          <th>Date de naissance</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr class="text-center" *ngFor="let item of eleves">
          <td>{{ item.numero_carte }}</td>
          <td>{{ item.prenom }}</td>
          <td>{{ item.nom }}</td>
          <td>{{ item.telephone }}</td>
          <td>{{ item.adresse }}</td>
          <td>{{ item.date_naissance }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="modifierEleve(item)">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn btn-danger btn-sm" (click)="supprimerEleve(item.id)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
