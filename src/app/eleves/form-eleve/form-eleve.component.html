<div class="card container-fluid">
    <div class="card-header">
      <div class="row">
        <div class="col-6">
          <h4>Formulaire Élève</h4>
        </div>
      </div>
    </div>
  
    <div class="card-body">
      <form [formGroup]="eleveform" (ngSubmit)="submitEleve()">
        <div class="row">
          <div class="col-6">
            <label for="numero_carte" class="form-label">Matricule</label>
            <input type="text" class="form-control" id="numero_carte" formControlName="numero_carte">
          </div>
          <div class="col-6">
            <label for="prenom" class="form-label">Prénom</label>
            <input type="text" class="form-control" id="prenom" formControlName="prenom">
          </div>
        </div>
  
        <div class="row">
          <div class="col-6">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" class="form-control" id="nom" formControlName="nom">
          </div>
          <div class="col-6">
            <label for="telephone" class="form-label">Téléphone</label>
            <input type="text" class="form-control" id="telephone" formControlName="telephone">
          </div>
        </div>
  
        <div class="row">
          <div class="col-6">
            <label for="Adresse" class="form-label">Adresse</label>
            <input type="text" class="form-control" id="Adresse" formControlName="Adresse">
          </div>
          <div class="col-6">
            <label for="date_naissance" class="form-label">Date de naissance</label>
            <input type="date" class="form-control" id="date_naissance" formControlName="date_naissance">
          </div>
        </div>
  
        <div class="row mt-3">
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </div>
      </form>
    </div>
  </div>
