<div class="container mt-4">
  <h4>{{ isEdit ? 'Modifier un élève' : 'Ajouter un élève' }}</h4>

  <form [formGroup]="eleveForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="numero_carte" class="form-label">Numero_carte</label>
      <input id="numero_carte" formControlName="numero_carte" class="form-control" required />
      <div *ngIf="eleveForm.get('numero_carte')?.invalid && eleveForm.get('numero_carte')?.touched" class="text-danger">
        Le Numero_carte est requis
      </div>
    </div>
    <div class="mb-3">
      <label for="prenom" class="form-label">Prenom</label>
      <input id="prenom" formControlName="prenom" class="form-control" required />
      <div *ngIf="eleveForm.get('prenom')?.invalid && eleveForm.get('prenom')?.touched" class="text-danger">
        Le prénom est requis
      </div>
    </div>

    <div class="mb-3">
      <label for="nom" class="form-label">Nom</label>
      <input id="nom" formControlName="nom" class="form-control" required />
      <div *ngIf="eleveForm.get('nom')?.invalid && eleveForm.get('nom')?.touched" class="text-danger">
        Le nom est requis
      </div>
    </div>

    <div class="mb-3">
      <label for="adresse" class="form-label">Adresse</label>
      <input id="adresse" formControlName="adresse" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="telephone" class="form-label">Téléphone</label>
      <input id="telephone" formControlName="telephone" class="form-control" />
      <div *ngIf="eleveForm.get('telephone')?.invalid && eleveForm.get('telephone')?.touched" class="text-danger">
        Le numéro doit comporter 10 chiffres.
      </div>


    </div>

    <button type="submit" class="btn btn-primary" [disabled]="eleveForm.invalid">
      {{ isEdit ? 'Modifier' : 'Ajouter' }}
    </button>
    <button type="button" class="btn btn-secondary ms-2" (click)="annuler()">Annuler</button>
  </form>
</div>
