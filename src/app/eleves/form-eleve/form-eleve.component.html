<div class="container mt-4">
  <h4>Ajouter un élève</h4>

  <form [formGroup]="eleveForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="prenom" class="form-label">Prénom</label>
      <input type="text" id="prenom" formControlName="prenom" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="nom" class="form-label">Nom</label>
      <input type="text" id="nom" formControlName="nom" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="adresse" class="form-label">Adresse</label>
      <input type="text" id="adresse" formControlName="adresse" class="form-control">
    </div>

    <div class="mb-3">
      <label for="telephone" class="form-label">Téléphone</label>
      <input type="text" id="telephone" formControlName="telephone" class="form-control">
    </div>

    <div class="mb-3">
      <label for="date_naissance" class="form-label">Date de naissance</label>
      <input type="date" id="date_naissance" formControlName="date_naissance" class="form-control">
    </div>

    <button type="submit" class="btn btn-success" [disabled]="eleveForm.invalid">Ajouter</button>
    <button type="button" class="btn btn-secondary ms-2" (click)="annuler()">Annuler</button>
  </form>
</div>
