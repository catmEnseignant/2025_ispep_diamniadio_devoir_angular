<div class="card container-fluid shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">Liste des élèves</h4>
    <h5 class="mb-0 text-secondary">Nombre d'élèves: {{ eleves?.length || 0 }}</h5>
    <button class="btn btn-primary" (click)="addEleve()">Ajouter un élève</button>
  </div>

  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-primary">
        <tr>
          <th>Matricule</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Téléphone</th>
          <th>Adresse</th>
          <th>Date de naissance</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let eleve of eleves" class="align-middle">
          <td>{{ eleve.numero_carte }}</td>
          <td>{{ eleve.prenom }}</td>
          <td>{{ eleve.nom }}</td>
          <td>{{ eleve.telephone }}</td>
          <td>{{ eleve.Adresse }}</td>
          <td>{{ eleve.date_naissance | date: 'dd/MM/yyyy' }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="editEleve(eleve)" title="Modifier">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn btn-danger btn-sm" (click)="deleteEleve(eleve)" title="Supprimer">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
