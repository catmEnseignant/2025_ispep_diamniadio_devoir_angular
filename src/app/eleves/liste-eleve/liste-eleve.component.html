<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Liste des élèves</h3>
    <h3>Nombre d'élèves</h3>
    <a href="/eleves/ajouter" class="btn btn-success">➕ Ajouter un élève</a>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>Numéro Carte</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Adresse</th>
        <th>Téléphone</th>
        <th>Date Naissance</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let eleve of eleves">
        <td>{{ eleve.numero_carte }}</td>
        <td>{{ eleve.prenom }}</td>
        <td>{{ eleve.nom }}</td>
        <td>{{ eleve.adresse }}</td>
        <td>{{ eleve.telephone }}</td>
        <td>{{ eleve.date_naissance }}</td>
        <td>
          <a href="/eleves/modifier/{{eleve.id}}" class="btn btn-sm btn-warning me-2">✏️</a>
          <button class="btn btn-sm btn-danger" (click)="supprimerEleve(eleve.id)">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
