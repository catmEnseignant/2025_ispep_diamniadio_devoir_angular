<div class="card container-fluid">
  <div class="card-header">
    <div class="row">
      <div class="col-4">
        <h4>Liste des élèves</h4>
      </div>
      <div class="col-4">
        <h4>Nombre d'élèves : {{ eleves.length }}</h4>
      </div>
      <div class="col-4 text-end">
        <button class="btn btn-primary" (click)="addEleves()">Ajouter un élève</button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Numéro carte</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Adresse</th>
          <th>Téléphone</th>
          <th>Date de naissance</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let eleve of eleves">
          <td>{{ eleve.numero_carte }}</td>
          <td>{{ eleve.prenom }}</td>
          <td>{{ eleve.nom }}</td>
          <td>{{ eleve.adresse }}</td>
          <td>{{ eleve.telephone }}</td>
          <td>{{ eleve.date_naissance }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" (click)="editEleves(eleve)">✏️</button>
            <button class="btn btn-sm btn-danger" (click)="deleteEleves(eleve)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
