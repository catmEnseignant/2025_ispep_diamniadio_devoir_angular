<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Liste des élèves</h3>
  <button class="btn btn-primary" (click)="onAdd()">Ajouter un élève</button>
</div>

<div *ngIf="loading" class="text-center">
  <div class="spinner-border text-primary" role="status"></div>
</div>

<table *ngIf="!loading && eleves.length > 0" class="table table-striped">
  <thead>
    <tr>
      <th>Numéro carte</th>
      <th>Prénom</th>
      <th>Nom</th>
      <th>Adresse</th>
      <th>Téléphone</th>
      <th>Date de naissance</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let eleve of eleves">
      <td>{{ eleve.numero_carte }}</td>
      <td>{{ eleve.prenom }}</td>
      <td>{{ eleve.nom }}</td>
      <td>{{ eleve.adresse }}</td>
      <td>{{ eleve.telephone }}</td>
      <td>{{ eleve.date_naissance | date:'dd/MM/yyyy' }}</td>
      <td>
        <button class="btn btn-sm btn-warning me-1" (click)="onEdit(eleve.id)">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-danger" (click)="onDelete(eleve.id)">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>

<p *ngIf="!loading && eleves.length === 0" class="text-center">Aucun élève trouvé.</p>
