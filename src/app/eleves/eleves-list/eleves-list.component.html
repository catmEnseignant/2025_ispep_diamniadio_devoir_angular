
<div class="card container-fluid">
    <div class="card-header">
        <div class="row">
            <div class="col-4">
                <h4>Liste des eleves</h4>
            </div>

            <div class="col-4">
                <h4>Nombre d'eleve {{eleves?.length}}</h4>
            </div>

            <div class="col-4">
                <button class="btn btn-primary" (click)="addEleves()">Ajouter un(e) eleve</button>
            </div>

        </div>

    </div>
    <div class="card-body">

    </div>

    <table class="table">
        <thead>
        <tr>
            <th scope="col">Numero_carte</th>
            <th scope="col">Nom</th>
            <th scope="col">Prenom</th>
            <th scope="col">Date_naissance</th>
        </tr>
        </thead>
        <tbody >
          <tr *ngFor= "let eleve of eleves"> 
            <th scope="row"> {{eleve.nom}}</th>
            <th>{{eleve.prenom}}</th>
            <th> {{eleve.adresse}}</th>
            <th> {{eleve.date_naissance}}</th>
            <td>
                <button class="btn btn-warning btn-sm me-2" (click)="editEleves(eleve)">
                    <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn btn-danger btn-sm" (click)="deleteEleves(eleve)">              
                    <i class="bi bi-trash"></i>
                </button>
            </td>           
            </tr>        
        </tbody>
    </table>   
</div>
