<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-primary">👨‍🎓 Liste des élèves</h3>
    <button class="btn btn-success shadow-sm" (click)="addEleve()">
      <i class="fas fa-plus-circle me-2"></i> Ajouter un élève
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-bordered mb-0">
        <thead class="table-dark text-center">
          <tr>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Date de naissance</th>
            <th>Adresse</th>
            <th>Numéro carte</th>
            <th>Téléphone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody *ngIf="eleves && eleves.length > 0">
          <tr *ngFor="let eleve of eleves" class="text-center align-middle">
            <td>{{ eleve.prenom }}</td>
            <td>{{ eleve.nom }}</td>
            <td>{{ eleve.date_naissance }}</td>
            <td>{{ eleve.adresse }}</td>
            <td>{{ eleve.numero_carte }}</td>
            <td>{{ eleve.telephone }}</td>
            <td>
              <button class="btn btn-outline-primary btn-sm me-2" (click)="editEleve(eleve)">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteEleve(eleve)">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
        <tbody *ngIf="eleves && eleves.length === 0">
          <tr>
            <td colspan="7" class="text-center text-muted py-4">
              Aucun élève trouvé pour le moment.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="text-end mt-2 text-muted" *ngIf="eleves">
    <small>Total : {{ eleves.length }} élève(s)</small>
  </div>
</div>
