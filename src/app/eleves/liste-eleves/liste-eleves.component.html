<div class="container mt-4">
  <h4>Liste des élèves</h4>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Adresse</th>
        <th>Téléphone</th>
        <th>Date de naissance</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let eleve of eleves">
        <td>{{ eleve.prenom }}</td>
        <td>{{ eleve.nom }}</td>
        <td>{{ eleve.adresse }}</td>
        <td>{{ eleve.telephone }}</td>
        <td>{{ eleve.date_naissance }}</td>
        <td>
          <button class="btn btn-sm btn-primary" (click)="editer(eleve)">Éditer</button>
          <button class="btn btn-sm btn-danger" (click)="supprimer(eleve)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <button class="btn btn-success mt-3" (click)="ajouter()">Ajouter un élève</button>
</div>
