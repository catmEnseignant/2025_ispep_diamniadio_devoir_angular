<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-primary">👩‍🏫 Liste des enseignants</h3>
    <button class="btn btn-success shadow-sm" (click)="addEnseignant()">
      <i class="fas fa-plus-circle me-2"></i> Ajouter un enseignant
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-bordered mb-0">
        <thead class="table-dark text-center">
          <tr>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Matricule</th>
            <th>Adresse</th>
            <th>Téléphone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody *ngIf="enseignants && enseignants.length > 0">
          <tr *ngFor="let enseignant of enseignants" class="text-center align-middle">
            <td>{{ enseignant.prenom }}</td>
            <td>{{ enseignant.nom }}</td>
            <td>{{ enseignant.matricule }}</td>
            <td>{{ enseignant.adresse }}</td>
            <td>{{ enseignant.telephone }}</td>
            <td>
              <button class="btn btn-outline-primary btn-sm me-2" (click)="editEnseignant(enseignant)">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteEnseignant(enseignant)">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
        <tbody *ngIf="enseignants && enseignants.length === 0">
          <tr>
            <td colspan="6" class="text-center text-muted py-4">
              Aucun enseignant trouvé pour le moment.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="text-end mt-2 text-muted" *ngIf="enseignants">
    <small>Total : {{ enseignants.length }} enseignant(s)</small>
  </div>
</div>
