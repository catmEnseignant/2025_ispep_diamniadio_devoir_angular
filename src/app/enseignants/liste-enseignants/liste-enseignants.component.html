<div class="container mt-4">
  <div class="row mb-3 align-items-center">
    <div class="col-md-4">
      <h4>Liste des enseignants</h4>
    </div>
    <div class="col-md-4 text-center">
      <h5>Nombre : {{ enseignants.length }}</h5>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-primary" (click)="ajouter()">Ajouter un enseignant</button>

    </div>
  </div>

  <table class="table table-bordered table-striped" *ngIf="enseignants.length > 0">
    <thead>
      <tr>
        <th>Matricule</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Téléphone</th>
        <th>Adresse</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let enseignant of enseignants">
        <td>{{ enseignant.matricule }}</td>
        <td>{{ enseignant.prenom }}</td>
        <td>{{ enseignant.nom }}</td>
        <td>{{ enseignant.telephone }}</td>
        <td>{{ enseignant.adresse }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-1" (click)="editer(enseignant)">
            ✏️
          </button>
          <button class="btn btn-sm btn-danger" (click)="supprimer(enseignant)">
            🗑️
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="enseignants.length === 0" class="text-muted text-center mt-4">
    Aucun enseignant enregistré pour le moment.
  </p>
</div>
