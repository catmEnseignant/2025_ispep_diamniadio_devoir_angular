<div class="card container-fluid mt-4">
  <div class="card-header bg-light">
    <div class="row align-items-center">
      <div class="col-md-4">
        <h4 class="mb-0">Liste des enseignants</h4>
      </div>
      <div class="col-md-4 text-center">
        <h4 class="mb-0">Nombre d'enseignants: {{enseignant.length}}</h4>
      </div>
      <div class="col-md-4 text-end">
        <button class="btn btn-success" (click)="addEnseignant()">
          <i class="bi bi-plus-circle"></i> Ajouter un enseignant
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Matricule</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Adresse</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of enseignant">
            <td>{{e.matricule}}</td>
            <td>{{e.prenom}}</td>
            <td>{{e.nom}}</td>
            <td>{{e.telephone}}</td>
            <td>{{e.adresse}}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="editEnseignant(e)">
                <i class="bi bi-pencil"></i> Modifier
              </button>
              <button class="btn btn-danger btn-sm">
                <i class="bi bi-trash"></i> Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
