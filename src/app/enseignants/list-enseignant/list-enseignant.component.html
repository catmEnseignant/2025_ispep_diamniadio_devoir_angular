<p>list-enseignant works!</p>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Liste des enseignants</h3>
      <span class="badge bg-primary">Nombre : {{ enseignants.length }}</span>
      <button class="btn btn-success" (click)="goToAjout()">Ajouter un enseignant</button>
    </div>
  
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Matricule</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Téléphone</th>
          <th>Adresse</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let enseignant of enseignants; index as i">
          <td>{{ i + 1 }}</td>
          <td>{{ enseignant.matricule }}</td>
          <td>{{ enseignant.prenom }}</td>
          <td>{{ enseignant.nom }}</td>
          <td>{{ enseignant.telephone }}</td>
          <td>{{ enseignant.adresse }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-6" (click)="editEnseignant(enseignant.id!)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteEnseignant(enseignant.id!)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
