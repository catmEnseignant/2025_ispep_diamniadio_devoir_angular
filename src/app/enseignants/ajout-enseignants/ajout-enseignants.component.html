
<div class="-card container-fluid" style="margin-top: -5.9%; background-color:white;">

    <div class="-card-hearder">

        <div>
            <div class="col-4" >
                <h4>Ajouter un enseignant</h4>
         </div>

<div class="card-body">
    <form [formGroup]="enseignantform" (ngSubmit)="storeEnseignant()">
        <div class="mb-3" id="valor">

          <label for="prenom" class="form-label">Prenom</label>
          <input type="text" class="form-control" formControlName="prenom"> <br><br>
       
          <label for="nom" class="form-label">Nom</label>
          <input type="text" class="form-control" formControlName="nom"> <br><br>
       
          
        </div>
        
        <div class="mb-3" id="cadre">

          <label for="telephone" class="form-label">Telephone</label>
          <input type="text" class="form-control" formControlName="telephone"> <br><br>

           <label for=" adresse" class="form-label">Adresse</label>
          <input type="text" class="form-control" formControlName="adresse"><br><br>
       
        </div>
        
        <div class="mb-3" id="cadres">
          <label for="matricule" class="form-label">Matricule</label>
          <input type="text" class="form-control" formControlName="matricule"><br><br>
        </div>
        <button type="submit" class="btn btn-primary" value="Enregistrer">Enregister</button>
    </form>
  </div>
</div>
</div>
