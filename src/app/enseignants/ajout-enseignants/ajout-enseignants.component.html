<div class="container mt-4">
  <h3 class="mb-3 text-primary">
    {{ isEditMode ? '✏️ Modifier un enseignant' : '➕ Ajouter un enseignant' }}
  </h3>

  <form [formGroup]="enseignantForm" (ngSubmit)="onSubmit()">
    
    <div class="mb-3">
      <label for="id" class="form-label">ID</label>
      <input type="text" id="id" class="form-control" formControlName="id">
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="matricule" class="form-label">Matricule</label>
        <input type="text" id="matricule" class="form-control" formControlName="matricule">
      </div>
      <div class="col-md-6">
        <label for="prenom" class="form-label">Prénom</label>
        <input type="text" id="prenom" class="form-control" formControlName="prenom">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" class="form-control" formControlName="nom">
      </div>
      <div class="col-md-6">
        <label for="telephone" class="form-label">Téléphone</label>
        <input type="text" id="telephone" class="form-control" formControlName="telephone">
      </div>
    </div>

    <div class="mb-3">
      <label for="adresse" class="form-label">Adresse</label>
      <input type="text" id="adresse" class="form-control" formControlName="adresse">
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary">
        {{ isEditMode ? 'Mettre à jour' : 'Ajouter' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="router.navigate(['/enseignants/list-enseignants'])">
        Annuler
      </button>
    </div>
  </form>
</div>
