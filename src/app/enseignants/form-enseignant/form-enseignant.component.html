<h3>Ajouter / Modifier un enseignant</h3>
<form [formGroup]="enseignantForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label>Prénom</label>
    <input type="text" class="form-control" formControlName="prenom">
  </div>

  <div class="mb-3">
    <label>Nom</label>
    <input type="text" class="form-control" formControlName="nom">
  </div>

  <div class="mb-3">
    <label>Spécialité</label>
    <input type="text" class="form-control" formControlName="specialite">
  </div>

  <div class="mb-3">
    <label>Email</label>
    <input type="email" class="form-control" formControlName="email">
  </div>

  <div class="mb-3">
    <label>Téléphone</label>
    <input type="text" class="form-control" formControlName="telephone">
  </div>

  <button class="btn btn-primary" type="submit" [disabled]="enseignantForm.invalid">Valider</button>
</form>
