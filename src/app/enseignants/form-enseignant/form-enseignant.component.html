<div class="container mt-4">
  <h4>{{ isEdit ? 'Modifier un enseignant' : 'Ajouter un enseignant' }}</h4>

  <form [formGroup]="enseignantForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="prenom" class="form-label">Prénom</label>
      <input id="prenom" formControlName="prenom" class="form-control" required />
    </div>
    <div class="mb-3">
      <label for="matricule" class="form-label">Matricule</label>
      <input id="matricule" formControlName="matricule" class="form-control" required />

    </div>

    <div class="mb-3">
      <label for="nom" class="form-label">Nom</label>
      <input id="nom" formControlName="nom" class="form-control" required />
    </div>

  
    <div class="mb-3">
      <label for="telephone" class="form-label">Téléphone</label>
      <input id="telephone" formControlName="telephone" class="form-control" />
    </div>
    <div class="mb-3">
      <label for="adresse" class="form-label">Adresse</label>
      <input id="adresse" formControlName="adresse" class="form-control" />
    </div>

    <button type="submit" class="btn btn-success" [disabled]="enseignantForm.invalid">
      {{ isEdit ? 'Modifier' : 'Ajouter' }}
    </button>
    <button type="button" class="btn btn-secondary ms-2" (click)="annuler()">Annuler</button>
  </form>
</div>
