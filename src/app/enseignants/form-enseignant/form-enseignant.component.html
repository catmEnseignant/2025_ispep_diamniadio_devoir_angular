<div class="card container-fluid">
    <div class="card-header">
        <div class="row">
            <div class="col-4">
                <h4>Formulaire enseignant</h4>
            </div>
            <div class="col-4">
                <h4>Nombre de enseignant</h4>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="container">
            <form [formGroup] ="classform" (ngSubmit)="storeEnseignant()">
                <div class="row">
                    <div class="col-6">
                        <label for="matricule" class="form-label">Matricule</label>
                        <input type="" class="form-control" formControlName="matricule" id="matricule" >
                    </div>
                    <div class="col-6">
                        <label for="prenom" class="form-label">Prenom</label>
                        <input type="prenom" class="form-control" formControlName="Prenom" id="prenom">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="nom" class="form-control" formControlName="nom" id="nom">
                    </div>
                    <div class="col-6">
                        <label for="telephone"class="form-label">Telephone</label>
                        <input type="telephone" class="form-control" formControlName="telephone" id="telephone">
                    </div>    
                    <div class="col-6">
                        <label for="adresse"class="form-label">Adresse</label>
                        <input type="adresse" class="form-control" formControlName="adresse" id="adresse">
                    </div>
                </div>
                <div class="row">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>

        </div>
    </div>
</div>
