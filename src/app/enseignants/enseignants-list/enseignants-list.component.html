<div class="card container-fluid">
  <div class="card-header d-flex justify-content-between">
    <h4>Liste des enseignants</h4>
    <button class="btn btn-primary" (click)="addEnseignants()">Ajouter un enseignant</button>
  </div>
  <div class="card-body">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Matière</th>
          <th>Adresse</th>
          <th>Téléphone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let enseignant of enseignants">
          <td>{{ enseignant.prenom }}</td>
          <td>{{ enseignant.nom }}</td>
          <td>{{ enseignant.matiere }}</td>
          <td>{{ enseignant.adresse }}</td>
          <td>{{ enseignant.telephone }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="editEnseignants(enseignant)">✏️</button>
            <button class="btn btn-danger btn-sm" (click)="deleteEnseignants(enseignant)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
