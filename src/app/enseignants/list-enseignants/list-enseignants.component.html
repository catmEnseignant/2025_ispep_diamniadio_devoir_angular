<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Liste des enseignants ({{ enseignants.length }})</h3>
  <button class="btn btn-primary" routerLink="ajouter">
    <i class="bi bi-plus-circle"></i> Ajouter un enseignant
  </button>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th><th>Prénom</th><th>Nom</th>
      <th>Spécialité</th><th>Email</th><th>Téléphone</th><th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let enseignant of enseignants">
      <td>{{ enseignant.id }}</td>
      <td>{{ enseignant.prenom }}</td>
      <td>{{ enseignant.nom }}</td>
      <td>{{ enseignant.specialite }}</td>
      <td>{{ enseignant.email }}</td>
      <td>{{ enseignant.telephone }}</td>
      <td>
        <button class="btn btn-sm btn-secondary me-1" (click)="edit(enseignant)">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-danger" (click)="delete(enseignant)">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>
