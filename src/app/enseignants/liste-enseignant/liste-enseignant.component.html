<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Liste des enseignants</h2>
    <a class="btn btn-primary" href="/enseignants/ajouter">➕ Ajouter un enseignant</a>
  </div>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Matricule</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Téléphone</th>
        <th>Adresse</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let enseignant of enseignants">
        <td>{{ enseignant.matricule }}</td>
        <td>{{ enseignant.prenom }}</td>
        <td>{{ enseignant.nom }}</td>
        <td>{{ enseignant.telephone }}</td>
        <td>{{ enseignant.adresse }}</td>
        <td>
          <a class="btn btn-sm btn-warning me-2" [href]="'/enseignants/modifier/' + enseignant.id">
            ✏️ Modifier
          </a>
          <button class="btn btn-sm btn-danger" (click)="supprimerEnseignant(enseignant.id)">
            🗑 Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
