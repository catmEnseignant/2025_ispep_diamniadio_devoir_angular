<div class="container mt-4">
    <!-- En-tête -->
    <div class="row mb-4">
        <div class="col-md-4">
            <h2>Liste des élèves</h2>
        </div>
        <div class="col-md-4 text-center">
            <h4 class="badge bg-info fs-6">Nombre d'élèves: {{eleves.length}}</h4>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary" (click)="ajouterEleve()">
                <i class="fas fa-plus"></i> Ajouter un élève
            </button>
        </div>
    </div>

    <!-- Tableau -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>N° Carte</th>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Adresse</th>
                <th>Date Naissance</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let eleve of eleves">
                <td>{{eleve.numero_carte}}</td>
                <td>{{eleve.prenom}}</td>
                <td>{{eleve.nom}}</td>
                <td>{{eleve.telephone}}</td>
                <td>{{eleve.adresse}}</td>
                <td>
                    <button class="btn btn-sm btn-warning me-2" (click)="modifierEleve(eleve.id!)">
                        <i class="fas fa-pencil-alt"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" (click)="supprimerEleve(eleve.id!, eleve.prenom + ' ' + eleve.nom)">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
