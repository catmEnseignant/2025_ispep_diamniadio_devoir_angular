<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>{{isEditMode ? 'Modifier' : 'Ajouter'}} un Enseignant</h3>
                </div>
                <div class="card-body">
                    <form [formGroup]="enseignantForm" (ngSubmit)="onSubmit()">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">N° de Matricule *</label>
                                <input type="text" class="form-control" formControlName="matricule"
                                       [class.is-invalid]="enseignantForm.get('matricule')?.invalid && enseignantForm.get('matricule')?.touched">
                                <div class="invalid-feedback">
                                    Le numéro de carte est requis
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Prénom *</label>
                                <input type="text" class="form-control" formControlName="prenom"
                                       [class.is-invalid]="enseignantForm.get('prenom')?.invalid && enseignantForm.get('prenom')?.touched">
                                <div class="invalid-feedback">
                                    Le prénom est requis
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nom *</label>
                                <input type="text" class="form-control" formControlName="nom"
                                       [class.is-invalid]="enseignantForm.get('nom')?.invalid && enseignantForm.get('nom')?.touched">
                                <div class="invalid-feedback">
                                    Le nom est requis
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Téléphone *</label>
                            <input type="tel" class="form-control" formControlName="telephone"
                                   [class.is-invalid]="enseignantForm.get('telephone')?.invalid && enseignantForm.get('telephone')?.touched">
                            <div class="invalid-feedback">
                                Le téléphone est requis
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Adresse *</label>
                            <textarea class="form-control" rows="3" formControlName="adresse"
                                      [class.is-invalid]="enseignantForm.get('adresse')?.invalid && enseignantForm.get('adresse')?.touched"></textarea>
                            <div class="invalid-feedback">
                                L'adresse est requise
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-secondary" (click)="retour()">
                                <i class="fas fa-arrow-left"></i> Retour
                            </button>
                            <button type="submit" class="btn btn-primary" [disabled]="enseignantForm.invalid">
                                <i class="fas fa-save"></i> {{isEditMode ? 'Modifier' : 'Ajouter'}}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
