<div class="card container-fluid">
  <div class="card-header">
    <div class="row">
      <div class="col-4">
        <h4>Formulaire Enseignant</h4>
      </div>
      <div class="col-4">
        <h4>Nombre d'enseignants</h4>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="container">
      <form [formGroup]="enseignantForm" (ngSubmit)="submitEnseignant()">
        <div class="row">
          <div class="col-6">
            <label for="matricule" class="form-label">Matricule</label>
            <input type="text" class="form-control" formControlName="matricule" id="matricule">
          </div>
          <div class="col-6">
            <label for="prenom" class="form-label">Prénom</label>
            <input type="text" class="form-control" formControlName="prenom" id="prenom">
          </div>
        </div>

        <div class="row">
          <div class="col-6">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" class="form-control" formControlName="nom" id="nom">
          </div>
          <div class="col-6">
            <label for="adresse" class="form-label">Adresse</label>
            <input type="text" class="form-control" formControlName="adresse" id="adresse">
          </div>
        </div>

        <div class="row">
          <div class="col-6">
            <label for="telephone" class="form-label">Téléphone</label>
            <input type="tel" class="form-control" formControlName="telephone" id="telephone">
          </div>
        </div>
        

        <div class="row mt-3">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
