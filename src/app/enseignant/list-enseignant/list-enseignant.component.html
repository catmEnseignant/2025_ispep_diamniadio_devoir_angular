<div class="container mt-4">
  <div *ngIf="!loading">
    <app-loader></app-loader>
  </div>
  <div class="row mb-3 text-center">
    <div class="col-4">
      <h2 class="fw-bold text-secondary">La liste des enseignants</h2>
    </div>
    <div class="col-6">
      <h2 class="fw-bold text-secondary">Nombre d'enseignants ({{ enseignants.length }})</h2>
    </div>
    <div class="col-2">
        <button class="btn btn-primary fw-bold" (click)="ajouterEnseignants()">Add</button>
    </div>
  </div>
  <table class="table text-center">
    <thead class="table-light">
      <tr>
        <th scope="col">Prenom</th>
        <th scope="col">Nom</th>
        <th scope="col">Adresse</th>
        <th scope="col">Téléphone</th>
        <th scope="col">Matricule</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of enseignants">
        <td>{{ item.prenom }}</td>
        <td>{{ item.nom }}</td>
        <td>{{ item.adresse }}</td>
        <td>{{ item.telephone }}</td>
        <td>{{ item.matricule }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="editEnseignant(item)">
            <i class="bi bi-pencil-square"></i>
          </button>
          <button class="btn btn-danger btn-sm" (click)="supprimerEnseignant(item)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
